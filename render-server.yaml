services:
  - type: web
    name: vault-api
    env: node
    plan: free
    rootDirectory: packages/server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://app.vault1040.com
      # Shared secret for requests from the Next.js proxy routes. Must match
      # API_SECRET_KEY on the client service — without it those requests carry
      # no credential and are rejected by middleware/require-auth.ts.
      - key: API_SECRET_KEY
        sync: false  # Set in Render dashboard
      # Set to "report" for the first deploy: logs what would be rejected
      # instead of rejecting it. Remove once the log is quiet to enforce.
      - key: API_AUTH_MODE
        sync: false
      - key: AIRTABLE_PERSONAL_ACCESS_TOKEN
        sync: false  # Set this in Render dashboard
      - key: AIRTABLE_BASE_ID
        sync: false  # Set this in Render dashboard
      - key: AIRTABLE_USERS_TABLE
        value: Users
      - key: AWS_ACCESS_KEY_ID
        sync: false  # Set this in Render dashboard
      - key: AWS_SECRET_ACCESS_KEY
        sync: false  # Set this in Render dashboard
      - key: AWS_REGION
        sync: false  # Set this in Render dashboard
      - key: AWS_S3_BUCKET
        sync: false  # Set this in Render dashboard
      - key: GOOGLE_DRIVE_CREDENTIALS_JSON
        sync: false  # Set this in Render dashboard
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false  # Set this in Render dashboard
      - key: YOUTUBE_API_KEY
        sync: false  # Set this in Render dashboard - Get from Google Cloud Console
      - key: YOUTUBE_CHANNEL_ID
        sync: false  # Set this in Render dashboard - Your YouTube channel ID
